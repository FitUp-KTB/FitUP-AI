name: CI/CD Pipeline for FastAPI Deployment

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set IMAGE_NAME
        id: set-image
        run: |
          if [[ "${GITHUB_REF##*/}" == "main" ]]; then
            echo "IMAGE_NAME=${{ secrets.DOCKER_HUB_USERNAME }}/fitup-ai" >> $GITHUB_ENV
          else
            echo "IMAGE_NAME=${{ secrets.DOCKER_HUB_USERNAME }}/fitup-ai-dev" >> $GITHUB_ENV
          fi

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.ref_name }} .

      - name: Push Docker image
        run: docker push $IMAGE_NAME:${{ github.ref_name }}

  deploy:
    name: Deploy to Remote Server via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [[ "${GITHUB_REF##*/}" == "main" ]]; then
              IMAGE_NAME=${{ secrets.DOCKER_HUB_USERNAME }}/fitup-ai
              CONTAINER_NAME=fitup-ai
            else
              IMAGE_NAME=${{ secrets.DOCKER_HUB_USERNAME }}/fitup-ai-dev
              CONTAINER_NAME=fitup-ai-dev
            fi

            docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_PASSWORD }}
            docker pull $IMAGE_NAME:${{ github.ref_name }}

            # 기존 컨테이너 중지 및 삭제
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            # 컨테이너 실행
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p 8000:8000 \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e GOOGLE_GEMINI_API_KEY="${{ secrets.GOOGLE_GEMINI_API_KEY }}" \
              --network fitup-network \
              $IMAGE_NAME:${{ github.ref_name }}
